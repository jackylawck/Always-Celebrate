<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常慶功 Always Celebrate | 經常慶功，就會成功。</title>
    
    <!-- 🛡️ Content Security Policy: 嚴格封殺所有出站連線，確保 100% 本地隱私與防 AI 採集 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'self' data:; frame-ancestors 'none';">

    <!-- 📱 PWA & Apple iOS 手機桌面安裝支援 -->
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./DAILYOFFicon-512.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./DAILYOFFicon-192.png">
    
    <meta name="theme-color" content="#0b0f19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="常慶功">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --card-border: #2c3e50;
            --accent-gold: #f39c12;
            --accent-gold-hover: #d35400;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --input-bg: #070a12;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-stack);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container { max-width: 680px; width: 100%; }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--card-border);
        }

        .app-title { font-size: 1.6rem; font-weight: 700; color: var(--text-primary); }
        .app-slogan { font-size: 0.88rem; color: var(--accent-gold); margin-top: 2px; }

        .lang-switch-group {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
        }

        .lang-btn {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .lang-btn.active {
            background: var(--accent-gold);
            color: #ffffff;
            font-weight: 600;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .mode-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            background: var(--input-bg);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.88rem;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--accent-gold);
            font-weight: 600;
        }

        input[type="text"], input[type="password"], input[type="date"], textarea, select {
            width: 100%;
            padding: 12px;
            margin: 6px 0 14px 0;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
        }

        input:focus, textarea:focus, select:focus { border-color: var(--accent-gold); }
        textarea { resize: vertical; min-height: 100px; }

        .btn-primary {
            background: var(--accent-gold);
            color: #ffffff;
            border: none;
            padding: 13px 20px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-primary:hover { background: var(--accent-gold-hover); }

        .saved-list {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .entry-item {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px;
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--accent-gold);
            margin-bottom: 6px;
        }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <canvas id="confetti-canvas"></canvas>

    <div class="app-container">
        <header class="header-section">
            <div>
                <h1 class="app-title" id="txt-app-title">常慶功 Always Celebrate</h1>
                <p class="app-slogan" id="txt-app-slogan">經常慶功，就會成功。| Celebrate today, succeed tomorrow.</p>
            </div>
            <div class="lang-switch-group">
                <button class="lang-btn active" id="btn-zh" onclick="setLanguage('zh')">中文</button>
                <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">English</button>
            </div>
        </header>

        <!-- 保險庫解密卡片 -->
        <div class="card" id="vault-auth-card">
            <input type="password" id="master-password" placeholder="主密碼 Master Password">
            <button class="btn-primary" onclick="unlockVault()" id="btn-unlock">解鎖 Unlock</button>
        </div>

        <!-- 預祝與書寫區域 -->
        <div class="card" id="writing-hub" style="display: none;">
            <div class="mode-tabs">
                <button class="tab-btn active" id="tab-quick" onclick="switchTab('quick')">✨ 30秒快祝</button>
                <button class="tab-btn" id="tab-flip" onclick="switchTab('flip')">🧱 逆境轉化</button>
                <button class="tab-btn" id="tab-future" onclick="switchTab('future')">✉️ 未來信</button>
            </div>

            <div id="panel-quick">
                <input type="text" id="quick-title" placeholder="標題 Title">
                <textarea id="quick-content" placeholder="太棒了！我已經成功..."></textarea>
            </div>

            <div id="panel-flip" style="display: none;">
                <textarea id="flip-obstacle" placeholder="目前的挑戰或困擾..."></textarea>
                <textarea id="flip-reframe" placeholder="轉化後的預祝結果..."></textarea>
            </div>

            <div id="panel-future" style="display: none;">
                <input type="date" id="future-unlock-date">
                <textarea id="future-content" placeholder="寫給未來達成目標的自己..."></textarea>
            </div>

            <select id="mood-selector">
                <option value="🎉 預祝成功">🎉 預祝成功 Pre-Celebrated</option>
                <option value="🚀 逆境突破">🚀 逆境突破 Challenge Overcome</option>
                <option value="🌿 靜思沉澱">🌿 靜思沉澱 Mindful Reflection</option>
            </select>

            <button class="btn-primary" onclick="saveEntry()" id="btn-save">✨ 加密預祝並慶功</button>
            
            <div class="saved-list" id="saved-list"></div>
        </div>
    </div>

    <script>
        let currentLanguage = 'zh';
        let activeTab = 'quick';
        let aesKey = null;
        let memoryEntries = [];

        const i18nData = {
            zh: {
                appTitle: "常慶功 Always Celebrate",
                appSlogan: "經常慶功，就會成功。",
                tabQuick: "✨ 30秒快祝",
                tabFlip: "🧱 逆境轉化",
                tabFuture: "✉️ 未來信",
                quickTitleHolder: "標題 Title",
                quickContentHolder: "太棒了！我已經成功...",
                flipObstacleHolder: "目前的挑戰或困擾...",
                flipReframeHolder: "轉化後的預祝結果...",
                futureContentHolder: "寫給未來達成目標的自己...",
                btnUnlock: "解鎖 Unlock",
                btnSave: "✨ 加密預祝並慶功"
            },
            en: {
                appTitle: "Always Celebrate",
                appSlogan: "Celebrate today, succeed tomorrow.",
                tabQuick: "✨ Quick Wish",
                tabFlip: "🧱 Crisis Flip",
                tabFuture: "✉️ Future Capsule",
                quickTitleHolder: "Title",
                quickContentHolder: "Thrilled to share that I have successfully achieved...",
                flipObstacleHolder: "Current challenge or obstacle...",
                flipReframeHolder: "Pre-celebrate the resolution...",
                futureContentHolder: "Write to your future self...",
                btnUnlock: "Unlock",
                btnSave: "✨ Encrypt & Celebrate"
            }
        };

        function setLanguage(lang) {
            currentLanguage = lang;
            document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');

            const t = i18nData[lang];
            document.getElementById('txt-app-title').innerText = t.appTitle;
            document.getElementById('txt-app-slogan').innerText = t.appSlogan;
            document.getElementById('tab-quick').innerText = t.tabQuick;
            document.getElementById('tab-flip').innerText = t.tabFlip;
            document.getElementById('tab-future').innerText = t.tabFuture;
            document.getElementById('quick-title').placeholder = t.quickTitleHolder;
            document.getElementById('quick-content').placeholder = t.quickContentHolder;
            document.getElementById('flip-obstacle').placeholder = t.flipObstacleHolder;
            document.getElementById('flip-reframe').placeholder = t.flipReframeHolder;
            document.getElementById('future-content').placeholder = t.futureContentHolder;
            document.getElementById('btn-unlock').innerText = t.btnUnlock;
            document.getElementById('btn-save').innerText = t.btnSave;
        }

        function switchTab(tab) {
            activeTab = tab;
            document.getElementById('tab-quick').classList.toggle('active', tab === 'quick');
            document.getElementById('tab-flip').classList.toggle('active', tab === 'flip');
            document.getElementById('tab-future').classList.toggle('active', tab === 'future');

            document.getElementById('panel-quick').style.display = tab === 'quick' ? 'block' : 'none';
            document.getElementById('panel-flip').style.display = tab === 'flip' ? 'block' : 'none';
            document.getElementById('panel-future').style.display = tab === 'future' ? 'block' : 'none';
        }

        async function deriveKey(password, salt) {
            const encoder = new TextEncoder();
            const baseKey = await crypto.subtle.importKey(
                'raw', encoder.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
            );
            return await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
                baseKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
            );
        }

        async function unlockVault() {
            const pwd = document.getElementById('master-password').value;
            if (!pwd) return;

            const salt = new TextEncoder().encode("AlwaysCelebrateSaltKey");
            aesKey = await deriveKey(pwd, salt);

            document.getElementById('vault-auth-card').style.display = 'none';
            document.getElementById('writing-hub').style.display = 'block';
        }

        async function saveEntry() {
            if (!aesKey) return;

            let title = "", content = "";
            if (activeTab === 'quick') {
                title = document.getElementById('quick-title').value;
                content = document.getElementById('quick-content').value;
            } else if (activeTab === 'flip') {
                title = "🧱 逆境轉化";
                content = "挑戰: " + document.getElementById('flip-obstacle').value + "\n轉化: " + document.getElementById('flip-reframe').value;
            } else {
                title = "✉️ 未來信 (" + document.getElementById('future-unlock-date').value + ")";
                content = document.getElementById('future-content').value;
            }

            if (!content) return;

            const mood = document.getElementById('mood-selector').value;
            const entryObj = { title, content, mood, timestamp: new Date().toLocaleString() };

            memoryEntries.unshift(entryObj);
            renderEntries();
            fireConfetti();

            document.getElementById('quick-title').value = '';
            document.getElementById('quick-content').value = '';
            document.getElementById('flip-obstacle').value = '';
            document.getElementById('flip-reframe').value = '';
            document.getElementById('future-content').value = '';
        }

        function renderEntries() {
            const listEl = document.getElementById('saved-list');
            listEl.innerHTML = '';
            memoryEntries.forEach(item => {
                const div = document.createElement('div');
                div.className = 'entry-item';
                div.innerHTML = `
                    <div class="entry-header">
                        <span>${item.mood} | ${item.title || '隨筆'}</span>
                        <span>${item.timestamp}</span>
                    </div>
                    <div style="white-space: pre-wrap;">${item.content}</div>
                `;
                listEl.appendChild(div);
            });
        }

        function fireConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let confetti = [];
            for (let i = 0; i < 60; i++) {
                confetti.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    color: ['#f39c12', '#e74c3c', '#3498db', '#2ecc71'][Math.floor(Math.random() * 4)],
                    size: Math.random() * 7 + 4,
                    speedY: Math.random() * 4 + 2,
                    speedX: Math.random() * 2 - 1
                });
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                confetti.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                    p.y += p.speedY;
                    p.x += p.speedX;
                });
                if (confetti.some(p => p.y < canvas.height)) {
                    requestAnimationFrame(draw);
                }
            }
            draw();
        }
    </script>
</body>
</html>
